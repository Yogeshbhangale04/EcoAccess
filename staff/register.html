<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Staff Registration</title>
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body>
    <div class="center">
      <div class="form-card">
        <a href="../login.html">← Login</a>
        <h2>Staff Registration</h2>
        <p>OTP verification is simulated.</p>
        <form id="staffRegister" novalidate>
          <label>Name<input id="staffName" maxlength="20" required /></label
          ><label>Employee ID<input required /></label
          ><label>Mobile<input id="staffMobile" type="tel" inputmode="numeric" maxlength="10" required /></label
          ><label>Email<input id="staffEmail" type="email" required /></label
          ><label>Password<input type="password" required /></label
          ><button class="btn full">Submit for OTP Verification</button>
        </form>
      </div>
    </div>
    <div id="toast"></div>
    <script src="../js/app.js"></script>
  </body>
</html>
