<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Staff Registration</title>
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body>
    <div class="center">
      <div class="form-card">
        <a href="../login.html">← Login</a>
        <h2>Staff Registration</h2>
        <p>OTP verification is simulated.</p>
        <form id="staffRegister" novalidate>
          <label>Name<input id="staffName" maxlength="20" placeholder="Enter full name" required /><span class="field-error" id="staffNameError"></span></label
          ><label>Employee ID<input id="staffEmpId" placeholder="STF1001" required /><span class="field-error" id="staffEmpError"></span></label
          ><label>Mobile<span class="phone-field"><span class="phone-code">+91</span><input id="staffMobile" type="tel" inputmode="numeric" maxlength="10" placeholder="9876543210" required /></span><span class="field-error" id="staffMobileError"></span></label
          ><label>Email<input id="staffEmail" type="email" placeholder="name@example.com" required /><span class="field-error" id="staffEmailError"></span></label
          ><label>Password<input id="staffPw" type="password" placeholder="8+ chars with upper, lower, number" required /><span class="field-error" id="staffPwError"></span></label
          ><button class="btn full">Submit for OTP Verification</button>
        </form>
      </div>
    </div>
    <div id="toast"></div>
    <script src="../js/app.js"></script>
  </body>
</html>
