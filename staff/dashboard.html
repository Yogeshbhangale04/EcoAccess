<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Staff Dashboard</title>
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body>
    <div class="app">
      <aside>
        <a class="brand" href="dashboard.html"><b>EA</b> EcoAccess</a>
        <nav>
          <a href="dashboard.html"><span data-i18n="dashboard">Dashboard</span></a>
          <a href="assigned.html"><span data-i18n="assignedBookings">Assigned Bookings</span></a>
          <a href="management.html"><span data-i18n="serviceManagement">Service Management</span></a>
          <a href="availability.html"><span data-i18n="availability">Availability</span></a>
        </nav>
        <button data-logout class="sidebtn"><span data-i18n="logout">Logout</span></button>
      </aside>
      <section class="main">
        <header class="top">
          <button id="menu">☰</button>
          <strong data-i18n="staffDashboard" data-i18n-title="staffDashboard">Staff Dashboard</strong>
          <span class="top-actions">
            <label class="lang-switch"><span data-i18n="language">Language</span>
              <select id="staffLang" aria-label="Language">
                <option value="en">English</option>
                <option value="hi">हिन्दी</option>
                <option value="mr">मराठी</option>
              </select>
            </label>
            <span id="user"></span>
          </span>
        </header>
        <main class="content">
          <h1 data-i18n="staffDashboard">Staff Dashboard</h1>
          <div class="stats">
            <div><span data-i18n="assigned">Assigned</span><b id="assigned">0</b></div>
            <div><span data-i18n="completed">Completed</span><b id="completed">0</b></div>
            <div><span data-i18n="availability">Availability</span><b id="availability">Available</b></div>
          </div>
          <div class="panel">
            <h2 data-i18n="workflow">Workflow</h2>
            <p data-i18n="workflowSteps">
              Accept → Reached Passenger → Service Started → Service Completed
            </p>
          </div>
        </main>
      </section>
    </div>
    <div id="toast"></div>
    <script src="../js/app.js"></script>
    <script src="../js/staff-i18n.js"></script>
    <script src="../js/staff.js"></script>
  </body>
</html>
