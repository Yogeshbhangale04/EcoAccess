<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Staff Dashboard</title>
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body>
    <div class="app">
      <aside>
        <a class="brand" href="dashboard.html"><b>EA</b> EcoAccess</a>
        <nav>
          <a href="dashboard.html"> Dashboard</a
          ><a href="assigned.html"> Assigned Bookings</a
          ><a href="management.html"> Service Management</a
          ><a href="availability.html"> Availability</a>
        </nav>
        <button data-logout class="sidebtn"> Logout</button>
      </aside>
      <section class="main">
        <header class="top">
          <button id="menu">☰</button><strong>Staff Dashboard</strong
          ><span id="user"></span>
        </header>
        <main class="content">
          <h1>Staff Dashboard</h1>
          <div class="stats">
            <div>Assigned<b id="assigned">0</b></div>
            <div>Completed<b id="completed">0</b></div>
            <div>Availability<b id="availability">Available</b></div>
          </div>
          <div class="panel">
            <h2>Workflow</h2>
            <p>
              Accept → Reached Passenger → Service Started → Service Completed
            </p>
          </div>
        </main>
      </section>
    </div>
    <div id="toast"></div>
    <script src="../js/app.js"></script>
    <script src="../js/staff.js"></script>
  </body>
</html>
