<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Assigned Bookings</title>
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body>
    <div class="app">
      <aside>
        <a class="brand" href="dashboard.html"><b>EA</b> EcoAccess</a>
        <nav>
          <a href="dashboard.html">⌂ Dashboard</a
          ><a href="assigned.html">▣ Assigned Bookings</a
          ><a href="management.html">⚙ Service Management</a
          ><a href="availability.html">● Availability</a>
        </nav>
        <button data-logout class="sidebtn">↪ Logout</button>
      </aside>
      <section class="main">
        <header class="top">
          <button id="menu">☰</button><strong>Assigned Bookings</strong
          ><span id="user"></span>
        </header>
        <main class="content">
          <h1>Assigned Bookings</h1>
          <div class="panel">
            <div class="toolbar">
              <input
                id="ssearch"
                placeholder="Search booking/passenger"
              /><select id="sfilter">
                <option value="">All</option>
                <option>Booked</option>
                <option>Accepted</option>
                <option>Reached Passenger</option>
                <option>Service Started</option>
                <option>Completed</option>
              </select>
            </div>
            <div id="assignedTable"></div>
          </div>
        </main>
        <div id="detailsPanel" class="details-panel" style="display: none">
          <div class="details-content">
            <button class="details-close" onclick="closeDetails()">✕</button>
            <div id="detailsInfo"></div>
          </div>
        </div>
      </section>
    </div>
    <div id="toast"></div>
    <script src="../js/app.js"></script>
    <script src="../js/staff.js"></script>
  </body>
</html>
