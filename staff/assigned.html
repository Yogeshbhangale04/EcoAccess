<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Assigned Bookings</title>
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body>
    <div class="app">
      <aside>
        <a class="brand" href="dashboard.html"><b>EA</b> EcoAccess</a>
        <nav>
          <a href="dashboard.html"><span data-i18n="dashboard">Dashboard</span></a>
          <a href="assigned.html"><span data-i18n="assignedBookings">Assigned Bookings</span></a>
          <a href="management.html"><span data-i18n="serviceManagement">Service Management</span></a>
          <a href="availability.html"><span data-i18n="availability">Availability</span></a>
        </nav>
        <button data-logout class="sidebtn"><span data-i18n="logout">Logout</span></button>
      </aside>
      <section class="main">
        <header class="top">
          <button id="menu">☰</button>
          <strong data-i18n="assignedBookings" data-i18n-title="assignedBookings">Assigned Bookings</strong>
          <span class="top-actions">
            <label class="lang-switch"><span data-i18n="language">Language</span>
              <select id="staffLang" aria-label="Language">
                <option value="en">English</option>
                <option value="hi">हिन्दी</option>
                <option value="mr">मराठी</option>
              </select>
            </label>
            <span id="user"></span>
          </span>
        </header>
        <main class="content">
          <h1 data-i18n="assignedBookings">Assigned Bookings</h1>
          <div class="panel">
            <div class="toolbar">
              <input id="ssearch" data-i18n-placeholder="searchAssigned" placeholder="Search booking/passenger" />
              <select id="sfilter">
                <option value="" data-i18n="allStatuses">All statuses</option>
                <option value="Booked" data-i18n="booked">Booked</option>
                <option value="Assigned" data-i18n="assigned">Assigned</option>
                <option value="Accepted" data-i18n="accepted">Accepted</option>
                <option value="Reached Passenger" data-i18n="reachedPassenger">Reached Passenger</option>
                <option value="Service Started" data-i18n="serviceStarted">Service Started</option>
                <option value="Completed" data-i18n="completed">Completed</option>
              </select>
              <select id="svcfilter">
                <option value="" data-i18n="allServices">All services</option>
                <option value="Porter" data-i18n="porter">Porter</option>
                <option value="Wheelchair" data-i18n="wheelchair">Wheelchair</option>
                <option value="Vehicle" data-i18n="vehicle">Vehicle</option>
              </select>
            </div>
            <div id="assignedTable"></div>
            <div id="listPager" class="pager"></div>
          </div>
        </main>
        <div id="detailsPanel" class="details-panel" style="display: none">
          <div class="details-content">
            <button class="details-close" onclick="closeDetails()">✕</button>
            <div id="detailsInfo"></div>
          </div>
        </div>
      </section>
    </div>
    <div id="toast"></div>
    <script src="../js/app.js"></script>
    <script src="../js/staff-i18n.js"></script>
    <script src="../js/staff.js"></script>
  </body>
</html>
