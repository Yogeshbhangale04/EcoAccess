<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Admin Registration</title>
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body>
    <div class="center">
      <div class="form-card">
        <a href="../login.html">← Login</a>
        <h2>Admin Registration</h2>
        <form id="adminRegister" novalidate>
          <label
            >Name<input
              id="adminName"
              maxlength="20"
              placeholder="Enter full name"
              required /><span
              class="field-error"
              id="adminNameError"
            ></span></label
          ><label
            >Email<input
              id="adminEmail"
              type="email"
              placeholder="name@example.com"
              required /><span
              class="field-error"
              id="adminEmailError"
            ></span></label
          ><label
            >Password<input
              id="adminPw"
              type="password"
              placeholder="8+ chars with upper, lower, number"
              required /><span
              class="field-error"
              id="adminPwError"
            ></span></label
          ><button class="btn full">Register</button>
        </form>
      </div>
    </div>
    <div id="toast"></div>
    <script src="../js/app.js"></script>
  </body>
</html>
