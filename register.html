<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Passenger Registration</title><link rel="stylesheet" href="css/style.css"></head><body><div class="center"><div class="form-card wide"><a href="index.html">← Home</a><h2>Passenger Registration</h2><form id="registerForm" novalidate><div class="formgrid"><label>Full Name<input id="name" maxlength="20" pattern="[A-Za-z ]{1,20}" required></label><label>Mobile Number<input id="mobile" type="tel" inputmode="numeric" maxlength="10" pattern="[6-9][0-9]{9}" required></label><label>Email<input id="email" type="email" required></label><label>Password<input id="pw" type="password" required></label><label>Confirm Password<input id="cpw" type="password" required></label></div><p class="hint">Password: 8+ chars, uppercase, lowercase and number.</p><button class="btn full">Register & Verify OTP</button></form></div></div><div id="otp" class="modal hidden"><div class="modalbox otp-box"><h2>OTP Verification</h2><p>Demo OTP: <b>123456</b></p><label>Enter 6-digit OTP<input id="otpInput" type="tel" inputmode="numeric" maxlength="6" autocomplete="one-time-code" placeholder="123456"></label><button type="button" class="btn full" id="verify">Verify</button></div></div><div id="toast"></div><script src="js/app.js"></script></body></html>
