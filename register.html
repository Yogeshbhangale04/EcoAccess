<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Passenger Registration</title><link rel="stylesheet" href="css/style.css"></head><body><div class="center"><div class="form-card"><a href="index.html">← Home</a><h2>Passenger Registration</h2><form id="registerForm" novalidate><label>Full Name<input id="name" maxlength="20" pattern="[A-Za-z ]{1,20}" placeholder="Enter full name" required><span class="field-error" id="nameError"></span></label><label>Mobile Number<span class="phone-field"><span class="phone-code">+91</span><input id="mobile" type="tel" inputmode="numeric" maxlength="10" pattern="[6-9][0-9]{9}" placeholder="9876543210" required></span><span class="field-error" id="mobileError"></span></label><label>Email<input id="email" type="email" placeholder="name@example.com" required><span class="field-error" id="emailError"></span></label><label>Password<input id="pw" type="password" placeholder="8+ chars with upper, lower, number" required><span class="field-error" id="pwError"></span></label><label>Confirm Password<input id="cpw" type="password" placeholder="Re-enter password" required><span class="field-error" id="cpwError"></span></label><p class="hint">Password: 8+ chars, uppercase, lowercase and number.</p><button class="btn full">Register & Verify OTP</button></form></div></div><div id="otp" class="modal hidden"><div class="modalbox otp-box"><h2>OTP Verification</h2><p>Demo OTP: <b>123456</b></p><label>Enter 6-digit OTP<input id="otpInput" type="tel" inputmode="numeric" maxlength="6" autocomplete="one-time-code" placeholder="123456"><span class="field-error" id="otpError"></span></label><button type="button" class="btn full" id="verify">Verify</button></div></div><div id="toast"></div><script src="js/app.js"></script></body></html>
