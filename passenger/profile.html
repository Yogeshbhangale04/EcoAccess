<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>My Profile</title>
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body>
    <div class="app">
      <aside>
        <a class="brand" href="dashboard.html"><b>EA</b> EcoAccess</a>
        <nav>
          <a href="dashboard.html"> Dashboard</a
          ><a href="journey-validation.html"> Validate Journey</a
          ><a href="create-booking.html"> Book Service</a
          ><a href="tracking.html"> My Bookings</a
          ><a href="waste.html"> Waste Disposal</a
          ><a href="feedback.html"> Feedback</a
          ><a href="profile.html"> Profile</a>
        </nav>
        <button data-logout class="sidebtn"> Logout</button>
      </aside>
      <section class="main">
        <header class="top">
          <button id="menu">☰</button><strong>My Profile</strong
          ><span class="top-actions"
            ><a class="wallet-nav" href="rewards.html" title="Reward wallet"
              ><span class="wallet-icon" aria-hidden="true"></span>
              <b id="walletPoints">0</b> pts</a
            ><span id="user"></span
          ></span>
        </header>
        <main class="content">
          <h1>My Profile</h1>
          <div class="panel profile-panel">
            <div class="profile-heading">
              <h2>Personal Details</h2>
              <button
                id="editProfile"
                class="icon-btn"
                type="button"
                title="Edit profile"
                aria-label="Edit profile"
              >
                ✎
              </button>
            </div>
            <div id="profileDetails" class="profile-details">
              <div><span>Name</span><b id="pnameView"></b></div>
              <div><span>Mobile</span><b id="pmobileView"></b></div>
              <div><span>Email</span><b id="pemailView"></b></div>
            </div>
            <form id="profile" class="profile-edit hidden" novalidate>
              <label>Name<input id="pname" maxlength="20" required /></label
              ><label>Mobile<input id="pmobile" disabled /></label
              ><label>Email<input id="pemail" type="email" required /></label
              ><button class="btn" type="submit">Update</button>
            </form>
          </div>
        </main>
      </section>
    </div>
    <div id="toast"></div>
    <script src="../js/app.js"></script>
    <script src="../js/dashboard.js"></script>
      <script>
      function initProfile(u){
        $('#pnameView').textContent=u.name;$('#pmobileView').textContent=u.mobile;$('#pemailView').textContent=u.email;$('#pname').value=u.name;$('#pmobile').value=u.mobile;$('#pemail').value=u.email;$('#editProfile').onclick=()=>{$('#profileDetails').classList.add('hidden');$('#profile').classList.remove('hidden');$('#editProfile').classList.add('hidden');$('#pname').focus()};$('#profile').onsubmit=e=>{e.preventDefault();const n=personNameError($('#pname').value);if(n)return toast(n,true);const em=emailError($('#pemail').value);if(em)return toast(em,true);let a=get('passengers'),x=a.find(y=>y.id===u.id);x.name=$('#pname').value.replace(/\s+/g,' ').trim();x.email=$('#pemail').value.trim();set('passengers',a);set('session',{role:'passenger',...x});$('#pnameView').textContent=x.name;$('#pemailView').textContent=x.email;$('#profileDetails').classList.remove('hidden');$('#profile').classList.add('hidden');$('#editProfile').classList.remove('hidden');$('#user').textContent=x.name;toast('Profile updated.')}}
      </script>
  </body>
</html>
