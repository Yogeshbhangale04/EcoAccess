<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>My Profile</title>
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body>
    <div class="app">
      <aside>
        <a class="brand" href="dashboard.html"><b>EA</b> EcoAccess</a>
        <nav>
          <a href="dashboard.html">Dashboard</a
          ><a href="journey-validation.html">Validate Journey</a
          ><a href="create-booking.html">Book Service</a
          ><a href="tracking.html">My Bookings</a
          ><a href="waste.html">Waste Disposal</a
          ><a href="feedback.html">Feedback</a
          ><a href="profile.html">Profile</a>
        </nav>
        <button data-logout class="sidebtn">Logout</button>
      </aside>
      <section class="main">
        <header class="top">
          <span class="top-left">
            <button id="menu">☰</button>
            <a class="header-back" href="dashboard.html">← Back</a>
            <strong>My Profile</strong>
          </span>
          <span class="top-actions"
            ><a class="wallet-nav" href="rewards.html" title="Reward wallet"
              ><span class="wallet-icon" aria-hidden="true"></span>
              <b id="walletPoints">0</b> pts</a
            ><span id="user"></span
          ></span>
        </header>
        <main class="content">
          <h1>My Profile</h1>
          <div class="panel profile-panel">
            <div class="profile-heading">
              <h2>Personal Details</h2>
              <button
                id="editProfile"
                class="icon-btn"
                type="button"
                title="Edit profile"
                aria-label="Edit profile"
              >
                ✎
              </button>
            </div>
            <div id="profileDetails" class="profile-details">
              <div><span>Name</span><b id="pnameView"></b></div>
              <div><span>Mobile</span><b id="pmobileView"></b></div>
              <div><span>Email</span><b id="pemailView"></b></div>
            </div>
            <form id="profile" class="profile-edit hidden" novalidate>
              <label>Name<input id="pname" maxlength="20" required /></label
              ><label
                >Mobile<span class="phone-field"
                  ><span class="phone-code">+91</span
                  ><input id="pmobile" disabled /></span></label
              ><label>Email<input id="pemail" type="email" required /></label>
              <div class="profile-actions">
                <button class="btn outline" type="button" id="cancelProfile">
                  Cancel
                </button>
                <button class="btn" type="submit">Update</button>
              </div>
            </form>
          </div>
        </main>
      </section>
    </div>
    <div id="toast"></div>
    <script src="../js/dummy-data.js"></script>
    <script src="../js/validations.js"></script>
    <script src="../js/app.js"></script>
    <script src="../js/dashboard.js"></script>
  </body>
</html>
