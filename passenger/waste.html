<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Waste Disposal & Rewards</title>
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body>
    <div class="app">
      <aside>
        <a class="brand" href="dashboard.html"><b>EA</b> EcoAccess</a>
        <nav>
          <a href="dashboard.html">⌂ Dashboard</a
          ><a href="journey-validation.html">✓ Validate Journey</a
          ><a href="create-booking.html">＋ Book Service</a
          ><a href="tracking.html">◎ My Bookings</a
          ><a href="waste.html">♻ Waste Disposal</a
          ><a href="feedback.html">☆ Feedback</a
          ><a href="profile.html">◯ Profile</a>
        </nav>
        <button data-logout class="sidebtn">↪ Logout</button>
      </aside>
      <section class="main">
        <header class="top">
          <button id="menu">☰</button><strong>Waste Disposal & Rewards</strong
          ><span class="top-actions"
            ><a class="rewards-nav" href="rewards.html" title="Rewards"
              >🪙 <span>Rewards</span></a
            ><span id="user"></span
          ></span>
        </header>
        <main class="content">
          <h1>Waste Disposal & Rewards</h1>
          <div class="notice">
            ⚠ Journey validation is required before this upload form is
            available.
          </div>
          <div class="grid2">
            <div class="panel">
              <h2>Submit Disposal Proof</h2>
              <form id="wasteForm">
                <label
                  >Waste Photo<input
                    id="photo"
                    type="file"
                    accept="image/*"
                    required /></label
                ><label
                  >Disposal Proof<input
                    id="proof"
                    type="file"
                    required /></label
                ><label
                  >Station<select id="wstation">
                    <option>Mumbai Central</option>
                    <option>Thane</option>
                    <option>Pune Junction</option>
                  </select></label
                ><button class="btn full">Submit for Review</button>
              </form>
            </div>
            <div class="panel">
              <h2>My Submissions</h2>
              <div id="wasteList"></div>
            </div>
          </div>
        </main>
      </section>
    </div>
    <div id="toast"></div>
    <script src="../js/app.js"></script>
    <script src="../js/dashboard.js"></script>
  </body>
</html>
