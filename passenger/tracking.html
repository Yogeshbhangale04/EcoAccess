<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Service Tracking</title>
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body>
    <div class="app">
      <aside>
        <a class="brand" href="dashboard.html"><b>EA</b> EcoAccess</a>
        <nav>
          <a href="dashboard.html">Dashboard</a
          ><a href="journey-validation.html">Validate Journey</a
          ><a href="create-booking.html">Book Service</a
          ><a href="tracking.html">My Bookings</a
          ><a href="waste.html">Waste Disposal</a
          ><a href="feedback.html">Feedback</a
          ><a href="profile.html">Profile</a>
        </nav>
        <button data-logout class="sidebtn">Logout</button>
      </aside>
      <section class="main">
        <header class="top">
          <button id="menu">☰</button><strong>Service Tracking</strong
          ><span class="top-actions"
            ><a class="wallet-nav" href="rewards.html" title="Reward wallet"
              ><span class="wallet-icon" aria-hidden="true"></span>
              <b id="walletPoints">0</b> pts</a
            ><span id="user"></span
          ></span>
        </header>
        <main class="content">
          <h1>Service Tracking</h1>
          <div class="panel">
            <div class="toolbar">
              <input
                id="search"
                placeholder="Booking ID e.g. BK-123456"
              /><button class="btn" id="track">Track</button>
            </div>
            <div id="bookingList"></div>
            <div id="listPager" class="pager"></div>
          </div>
          <div id="result" class="hidden grid2">
            <div class="panel">
              <h2>Status Timeline</h2>
              <div id="timeline"></div>
            </div>
            <div class="panel">
              <h2>Booking Details</h2>
              <div id="details"></div>
            </div>
          </div>
        </main>
      </section>
    </div>
    <div id="toast"></div>
    <script src="../js/app.js"></script>
    <script src="../js/booking.js"></script>
  </body>
</html>
