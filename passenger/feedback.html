<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Feedback & Complaint</title>
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body>
    <div class="app">
      <aside>
        <a class="brand" href="dashboard.html"><b>EA</b> EcoAccess</a>
        <nav>
          <a href="dashboard.html">Dashboard</a
          ><a href="journey-validation.html">Validate Journey</a
          ><a href="create-booking.html">Book Service</a
          ><a href="tracking.html">My Bookings</a
          ><a href="waste.html">Waste Disposal</a
          ><a href="feedback.html">Feedback</a
          ><a href="profile.html">Profile</a>
        </nav>
        <button data-logout class="sidebtn">Logout</button>
      </aside>
      <section class="main">
        <header class="top">
          <button id="menu">☰</button><strong>Feedback & Complaint</strong
          ><span class="top-actions"
            ><a class="wallet-nav" href="rewards.html" title="Reward wallet"
              ><span class="wallet-icon" aria-hidden="true"></span>
              <b id="walletPoints">0</b> pts</a
            ><span id="user"></span
          ></span>
        </header>
        <main class="content">
          <h1>Feedback & Complaint</h1>
          <div class="grid2 equal pair-boxes">
            <div class="panel">
              <form id="feedback">
                <label
                  >Type<select id="entryType">
                    <option value="Feedback">Feedback</option>
                    <option value="Complaint">Complaint</option>
                  </select></label
                ><label
                  >Booking ID<select id="bookingId">
                    <option value="">Select a booking</option>
                  </select><span class="field-error" id="bookingError"></span></label
                ><label
                  >Rating<select id="rating">
                    <option>5</option>
                    <option>4</option>
                    <option>3</option>
                    <option>2</option>
                    <option>1</option>
                  </select></label
                ><label
                  >Subject<input id="subject" required maxlength="80" /><span
                    class="field-error"
                    id="subjectError"
                  ></span></label
                ><label
                  >Description<textarea id="description" required></textarea
                  ><span
                    class="field-error"
                    id="descriptionError"
                  ></span></label
                ><button class="btn">Submit</button>
              </form>
            </div>
            <div class="panel">
              <h2>My Complaints</h2>
              <div class="toolbar">
                <input
                  id="listSearch"
                  type="search"
                  placeholder="Search complaint ID, booking ID or subject"
                />
              </div>
              <div id="complaints"></div>
              <div id="listPager" class="pager"></div>
            </div>
          </div>
        </main>
      </section>
    </div>
    <div id="toast"></div>
    <script src="../js/app.js"></script>
    <script src="../js/dashboard.js"></script>
  </body>
</html>
